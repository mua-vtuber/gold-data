name: Update Gold Price History

on:
  schedule:
    # 오후 16:00 KST (UTC 07:00) - 공공데이터포털 게시분 재확인
    - cron: '0 7 * * 1-5'
    # 오전 10:00 KST (UTC 01:00) - 공공데이터포털에서 누락 거래일 확인
    - cron: '0 1 * * 1-5'
  workflow_dispatch: # 수동 실행 가능
    inputs:
      mode:
        description: 'Mode: realtime (오후 재확인) or daily (공식 이력 동기화)'
        required: false
        default: 'daily'
  repository_dispatch: # 외부 cron 서비스에서 트리거 가능
    types: [update-realtime, update-daily]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run regression tests
        run: python -m unittest discover -s tests

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event.action }}" = "update-realtime" ]; then
            mode=realtime
          elif [ "${{ github.event.action }}" = "update-daily" ]; then
            mode=daily
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ github.event.inputs.mode }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              '0 7 * * 1-5') mode=realtime ;;
              '0 1 * * 1-5') mode=daily ;;
              *) echo "Unsupported schedule: ${{ github.event.schedule }}" >&2; exit 1 ;;
            esac
          else
            echo "Unsupported event: ${{ github.event_name }}" >&2
            exit 1
          fi

          case "$mode" in
            realtime|daily) echo "mode=$mode" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported mode: $mode" >&2; exit 1 ;;
          esac

      - name: Update gold price data
        env:
          KOREADATA_API_KEY: ${{ secrets.KOREADATA_API_KEY }}
        run: python scripts/update_price.py ${{ steps.mode.outputs.mode }}

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add history.json
          git diff --staged --quiet || git commit -m "Update gold price data - $(date +'%Y-%m-%d %H:%M') [${{ steps.mode.outputs.mode }}]"
          git push
